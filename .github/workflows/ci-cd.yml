name: EP3 - Build, Test, Publish, Provision, Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    name: Java - Maven verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: voyYvuelvo/**/pom.xml
      - run: mvn -B -ntp -f voyYvuelvo/pom.xml clean verify
  frontend:
    name: React - Vitest y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  serverless:
    name: Lambda - pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s serverless -v
  images:
    name: Docker - build y publicación (${{ matrix.service }})
    needs: [backend, frontend, serverless]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: mysql, context: voyYvuelvo/database}
          - {service: eureka, context: voyYvuelvo/infrastructure/eureka-server}
          - {service: api-gateway, context: voyYvuelvo/infrastructure/api-gateway}
          - {service: ms-usuario, context: voyYvuelvo/services/ms-usuario}
          - {service: ms-equipamiento, context: voyYvuelvo/services/ms-equipamiento}
          - {service: ms-ruta, context: voyYvuelvo/services/ms-ruta}
          - {service: ms-reserva, context: voyYvuelvo/services/ms-reserva}
          - {service: ms-pago, context: voyYvuelvo/services/ms-pago}
          - {service: frontend, context: frontend}
    steps:
      - uses: actions/checkout@v4
      - id: names
        env:
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
        run: echo "prefix=docker.io/${DOCKERHUB_USER:-voyvuelvo-local}/voyvuelvo-ep3" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USER != ''
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USER != '' }}
          tags: ${{ steps.names.outputs.prefix }}:${{ matrix.service }}-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  cloud:
    name: AWS - provisión y despliegue Swarm
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: cloud
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLOUD_STACK: ${{ vars.CLOUD_STACK || 'voyvuelvo-ep3' }}
      LAMBDA_ROLE_ARN: ${{ vars.LAMBDA_ROLE_ARN }}
      PUBLISHER_ROLE_NAME: ${{ vars.PUBLISHER_ROLE_NAME }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_SECURITY_GROUP: ${{ vars.SSH_SECURITY_GROUP }}
      SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
      APP_CORS_ORIGINS: ${{ vars.APP_CORS_ORIGINS || 'http://localhost:5173,http://127.0.0.1:5173' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Provisionar SQS, DLQ, Lambda, DynamoDB y Logs
        run: bash scripts/provision.sh
      - name: Autorizar temporalmente IP del runner (opcional)
        id: ssh_rule
        if: env.SSH_SECURITY_GROUP != ''
        run: |
          set -euo pipefail
          ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '\r\n')
          rule=$(aws ec2 authorize-security-group-ingress --group-id "$SSH_SECURITY_GROUP" --protocol tcp --port 22 --cidr "$ip/32" --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)
          echo "rule=$rule" >> "$GITHUB_OUTPUT"
      - name: Configurar SSH con huella verificada
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Desplegar versión exacta y verificar servicios
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          JWT_SECRET_BASE64: ${{ secrets.JWT_SECRET_BASE64 }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_READ_TOKEN || secrets.DOCKERHUB_TOKEN }}
          REGISTRY_USER: ${{ vars.DOCKERHUB_USER }}
        run: |
          bash scripts/remote-deploy.sh
      - name: Retirar acceso temporal SSH
        if: always() && steps.ssh_rule.outputs.rule != ''
        env:
          RULE_ID: ${{ steps.ssh_rule.outputs.rule }}
        run: aws ec2 revoke-security-group-ingress --group-id "$SSH_SECURITY_GROUP" --security-group-rule-ids "$RULE_ID"
