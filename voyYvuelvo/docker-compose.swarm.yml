version: '3.8'
services:
  mysql:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:mysql-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      placement:
        constraints:
        - node.labels.voydb == true
    environment:
      MYSQL_DATABASE: bd_gateway
      MYSQL_USER: voyapp
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - --silent
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 30
    secrets:
    - db_password
    - db_root_password
  eureka:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:eureka-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
  api-gateway:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:api-gateway-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - backend
    - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
    secrets:
    - source: db_password
      target: DB_PASSWORD
    - source: jwt_secret
      target: JWT_SECRET_BASE64
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  ms-usuario:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:ms-usuario-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      placement:
        preferences:
        - spread: node.hostname
    secrets:
    - source: db_password
      target: DB_PASSWORD
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  ms-equipamiento:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:ms-equipamiento-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      placement:
        preferences:
        - spread: node.hostname
    secrets:
    - source: db_password
      target: DB_PASSWORD
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  ms-ruta:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:ms-ruta-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      placement:
        preferences:
        - spread: node.hostname
        max_replicas_per_node: 1
    secrets:
    - source: db_password
      target: DB_PASSWORD
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  ms-reserva:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:ms-reserva-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - backend
    - egress
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      placement:
        preferences:
        - spread: node.hostname
    secrets:
    - source: db_password
      target: DB_PASSWORD
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:?Falta SQS_QUEUE_URL}
      AWS_REGION: ${AWS_REGION:-us-east-1}
  ms-pago:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:ms-pago-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      placement:
        preferences:
        - spread: node.hostname
    secrets:
    - source: db_password
      target: DB_PASSWORD
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  frontend:
    image: ${IMAGE_PREFIX:?Falta IMAGE_PREFIX}:frontend-${IMAGE_TAG:?Falta IMAGE_TAG}
    networks:
    - edge
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
    ports:
    - 80:8080
volumes:
  mysql_data: null
networks:
  edge:
    driver: overlay
  backend:
    driver: overlay
    internal: true
  egress:
    driver: overlay
secrets:
  db_password:
    external: true
    name: voyvuelvo_db_password
  db_root_password:
    external: true
    name: voyvuelvo_db_root_password
  jwt_secret:
    external: true
    name: voyvuelvo_jwt_secret
