spring.application.name=ms-reserva

# ==========================================
# CONFIGURACION DEL SERVIDOR
# ==========================================
server.port=8083

# ==========================================
# CONFIGURACION DE LA BASE DE DATOS (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/bd_reserva?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:voyapp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACION DE HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==========================================
# CONFIGURACION DE EUREKA CLIENT
# ==========================================
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# ==========================================
# CONFIGURACION DE SWAGGER
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:local}:${server.port}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.events.queue-url=${SQS_QUEUE_URL:}
app.events.region=${AWS_REGION:us-east-1}

spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=10000
