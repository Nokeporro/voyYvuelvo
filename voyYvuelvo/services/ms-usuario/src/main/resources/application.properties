# Puerto del microservicio
server.port=8084

# Nombre del microservicio para Eureka
spring.application.name=ms-usuario

# Conexion a la base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/bd_usuario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:voyapp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Conexion con Eureka Server
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Configuracion de Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${HOSTNAME:local}:${server.port}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=10000
