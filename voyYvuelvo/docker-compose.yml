
services:

  # FRONTEND REACT SERVIDO POR NGINX
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api-gateway

  # BASE DE DATOS MYSQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 30

  # SERVIDOR EUREKA
  eureka:
    build:
      context: ./infrastructure/eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      mysql:
        condition: service_healthy

  # API GATEWAY CON SEGURIDAD JWT
  api-gateway:
    build:
      context: ./infrastructure/api-gateway
      dockerfile: Dockerfile
    container_name: api-getaway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Falta configurar JWT_SECRET_BASE64}
    depends_on:
      eureka:
        condition: service_started
      mysql:
        condition: service_healthy

  # MICROSERVICIO DE USUARIOS
  ms-usuario:
    build:
      context: ./services/ms-usuario
      dockerfile: Dockerfile
    container_name: ms-usuario
    depends_on:
      eureka:
        condition: service_started
      mysql:
        condition: service_healthy

  # MICROSERVICIO DE EQUIPAMIENTO
  ms-equipamiento:
    build:
      context: ./services/ms-equipamiento
      dockerfile: Dockerfile
    container_name: ms-equipamiento
    depends_on:
      eureka:
        condition: service_started
      mysql:
        condition: service_healthy

  # MICROSERVICIO DE RUTAS
  ms-ruta:
    build:
      context: ./services/ms-ruta
      dockerfile: Dockerfile
    container_name: ms-ruta
    depends_on:
      eureka:
        condition: service_started
      mysql:
        condition: service_healthy

  # MICROSERVICIO DE RESERVAS
  ms-reserva:
    build:
      context: ./services/ms-reserva
      dockerfile: Dockerfile
    container_name: ms-reserva
    depends_on:
      eureka:
        condition: service_started
      mysql:
        condition: service_healthy

  # MICROSERVICIO DE PAGOS
  ms-pago:
    build:
      context: ./services/ms-pago
      dockerfile: Dockerfile
    container_name: ms-pago
    depends_on:
      eureka:
        condition: service_started
      mysql:
        condition: service_healthy

# VOLUMEN PERSISTENTE DE MYSQL
volumes:
  mysql_data:
