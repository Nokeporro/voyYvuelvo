name: voyvuelvo-ep3
services:
  mysql:
    build:
      context: ./database
    networks:
    - backend
    restart: on-failure
    environment:
      MYSQL_DATABASE: bd_gateway
      MYSQL_USER: voyapp
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - --silent
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 30
  eureka:
    build:
      context: ./infrastructure/eureka-server
    networks:
    - backend
    restart: on-failure
    ports:
    - 127.0.0.1:8761:8761
  api-gateway:
    build:
      context: ./infrastructure/api-gateway
    networks:
    - backend
    - edge
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    ports:
    - 127.0.0.1:8080:8080
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Falta JWT_SECRET_BASE64}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  ms-usuario:
    build:
      context: ./services/ms-usuario
    networks:
    - backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
  ms-equipamiento:
    build:
      context: ./services/ms-equipamiento
    networks:
    - backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
  ms-ruta:
    build:
      context: ./services/ms-ruta
    networks:
    - backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
  ms-reserva:
    build:
      context: ./services/ms-reserva
    networks:
    - backend
    - egress
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
  ms-pago:
    build:
      context: ./services/ms-pago
    networks:
    - backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_started
    environment:
      DB_USER: voyapp
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '5'
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
  frontend:
    build:
      context: ../frontend
    networks:
    - edge
    restart: on-failure
    ports:
    - 127.0.0.1:5173:8080
    depends_on:
    - api-gateway
volumes:
  mysql_data: null
networks:
  edge: {}
  backend:
    internal: true
  egress: {}
