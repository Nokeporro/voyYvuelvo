
services:

  # BASE DE DATOS MYSQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # SERVIDOR EUREKA
  eureka:
    build:
      context: ./infrastructure/eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - mysql

  # API GATEWAY CON SEGURIDAD JWT
  api-gateway:
    build:
      context: ./infrastructure/api-gateway
      dockerfile: Dockerfile
    container_name: api-getaway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Falta configurar JWT_SECRET_BASE64}
    depends_on:
      - eureka
      - mysql

  # MICROSERVICIO DE USUARIOS
  ms-usuario:
    build:
      context: ./services/ms-usuario
      dockerfile: Dockerfile
    container_name: ms-usuario
    depends_on:
      - eureka
      - mysql

  # MICROSERVICIO DE EQUIPAMIENTO
  ms-equipamiento:
    build:
      context: ./services/ms-equipamiento
      dockerfile: Dockerfile
    container_name: ms-equipamiento
    depends_on:
      - eureka
      - mysql

  # MICROSERVICIO DE RUTAS
  ms-ruta:
    build:
      context: ./services/ms-ruta
      dockerfile: Dockerfile
    container_name: ms-ruta
    depends_on:
      - eureka
      - mysql

  # MICROSERVICIO DE RESERVAS
  ms-reserva:
    build:
      context: ./services/ms-reserva
      dockerfile: Dockerfile
    container_name: ms-reserva
    depends_on:
      - eureka
      - mysql

  # MICROSERVICIO DE PAGOS
  ms-pago:
    build:
      context: ./services/ms-pago
      dockerfile: Dockerfile
    container_name: ms-pago
    depends_on:
      - eureka
      - mysql

# VOLUMEN PERSISTENTE DE MYSQL
volumes:
  mysql_data:
