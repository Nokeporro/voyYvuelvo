server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Conserva el puerto publicado (5173) al agregar la barra de un directorio.
    absolute_redirect off;

    # Resuelve de nuevo el Gateway si Docker cambia la IP de su contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /backend/ {
        set $gateway api-gateway:8080;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Un recurso inexistente debe devolver 404, no el HTML de React.
    location /assets/ {
        try_files $uri =404;
    }

    # Permite abrir y recargar directamente las rutas de React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
