<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos | Panel Voy &amp; Vuelvo</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-pagina="productos-listado">
  <div class="admin">
    <div class="admin__top">
      <a class="sidebar__marca" href="index.html"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="M2 34 15 11l7 12 4-6 12 17z" fill="#1E2A38"/><path d="M15 11l3.2 5.4-3.2-1.6-3 1.6z" fill="#fff"/></svg>Voy <span>&amp;</span> Vuelvo</a>
      <button class="admin__toggle" type="button" id="btn-menu" aria-expanded="false" aria-controls="sidebar">Menú</button>
    </div>
    <aside class="sidebar" id="sidebar" aria-label="Menú del panel">
      <div>
        <a class="sidebar__marca" href="index.html"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="M2 34 15 11l7 12 4-6 12 17z" fill="#1E2A38"/><path d="M15 11l3.2 5.4-3.2-1.6-3 1.6z" fill="#fff"/></svg>Voy <span>&amp;</span> Vuelvo</a>
        <p class="sidebar__rol">Panel de <strong data-sesion-rol>Administrador</strong></p>
        <nav aria-label="Secciones">
      <ul>
        <li><a class="enlace" href="index.html">Inicio</a></li>
        <li><a class="enlace" href="productos-listado.html" aria-current="page">Producto</a></li>
        <li data-solo-admin><a class="enlace" href="usuarios-listado.html">Usuario</a></li>
      </ul>
        </nav>
      </div>
      <div class="sidebar__pie">
        <span data-sesion-nombre>Administrador</span>
        <a class="btn btn--borde btn--sm" href="../index.html">Ver tienda</a>
        <button class="btn btn--borde btn--sm" type="button" id="btn-salir">Cerrar sesión</button>
      </div>
    </aside>
    <main class="contenido">
      <div class="contenido__cab">
        <h1>Productos</h1>
        <a class="btn btn--accion" href="producto-nuevo.html" data-solo-admin>Nuevo producto</a>
      </div>
      <div class="alerta alerta--ok" id="aviso" role="status" hidden></div>
      <section class="tarjeta" aria-label="Listado de productos">
        <label class="sr" for="buscador">Buscar producto</label>
        <input class="buscador" id="buscador" type="search" placeholder="Buscar por código, nombre o categoría" autocomplete="off">
        <div class="tabla-caja">
          <table>
            <caption class="sr">Listado de productos</caption>
            <thead><tr><th scope="col">Código</th><th scope="col">Nombre</th><th scope="col">Categoría</th><th scope="col">Precio</th><th scope="col">Stock</th><th scope="col">Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/admin.js"></script>
</body>
</html>
