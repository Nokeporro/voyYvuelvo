<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio | Panel Voy &amp; Vuelvo</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-pagina="dashboard">
  <div class="admin">
    <div class="admin__top">
      <a class="sidebar__marca" href="index.html"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="M2 34 15 11l7 12 4-6 12 17z" fill="#1E2A38"/><path d="M15 11l3.2 5.4-3.2-1.6-3 1.6z" fill="#fff"/></svg>Voy <span>&amp;</span> Vuelvo</a>
      <button class="admin__toggle" type="button" id="btn-menu" aria-expanded="false" aria-controls="sidebar">Menú</button>
    </div>
    <aside class="sidebar" id="sidebar" aria-label="Menú del panel">
      <div>
        <a class="sidebar__marca" href="index.html"><svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path d="M2 34 15 11l7 12 4-6 12 17z" fill="#1E2A38"/><path d="M15 11l3.2 5.4-3.2-1.6-3 1.6z" fill="#fff"/></svg>Voy <span>&amp;</span> Vuelvo</a>
        <p class="sidebar__rol">Panel de <strong data-sesion-rol>Administrador</strong></p>
        <nav aria-label="Secciones">
      <ul>
        <li><a class="enlace" href="index.html" aria-current="page">Inicio</a></li>
        <li><a class="enlace" href="productos-listado.html">Producto</a></li>
        <li data-solo-admin><a class="enlace" href="usuarios-listado.html">Usuario</a></li>
      </ul>
        </nav>
      </div>
      <div class="sidebar__pie">
        <span data-sesion-nombre>Administrador</span>
        <a class="btn btn--borde btn--sm" href="../index.html">Ver tienda</a>
        <button class="btn btn--borde btn--sm" type="button" id="btn-salir">Cerrar sesión</button>
      </div>
    </aside>
    <main class="contenido">
      <div class="contenido__cab"><h1>Inicio</h1></div>
      <section class="tarjeta bienvenida" aria-labelledby="hola">
        <h2 id="hola">¡Hola, <span data-sesion-nombre>Administrador</span>!</h2>
        <p>Desde aquí gestionas el catálogo de equipamiento y los usuarios de la tienda.</p>
      </section>
      <section class="resumen resumen--sep" aria-label="Resumen">
        <div class="tarjeta"><p class="resumen__n" id="n-productos">0</p><p class="resumen__t">Productos en catálogo</p></div>
        <div class="tarjeta"><p class="resumen__n" id="n-criticos">0</p><p class="resumen__t">Con stock crítico</p></div>
        <div class="tarjeta" data-solo-admin><p class="resumen__n" id="n-usuarios">0</p><p class="resumen__t">Usuarios registrados</p></div>
      </section>
    </main>
  </div>
  <script src="../js/admin.js"></script>

</html>
