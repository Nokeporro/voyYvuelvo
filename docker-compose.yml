version: "3.8"
services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  eureka:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - mysql

  api-gateway:
    build:
      context: ./api-getaway
      dockerfile: Dockerfile
    container_name: api-getaway
    ports:
      - "8080:8080"
    depends_on:
      - eureka
      - mysql

  ms-usuario:
    build:
      context: ./ms-usuario
      dockerfile: Dockerfile
    container_name: ms-usuario
    ports:
      - "8084:8084"
    depends_on:
      - eureka
      - mysql

  ms-equipamiento:
    build:
      context: ./ms-equipamiento
      dockerfile: Dockerfile
    container_name: ms-equipamiento
    ports:
      - "8081:8081"
    depends_on:
      - eureka
      - mysql

  ms-ruta:
    build:
      context: ./ms-ruta
      dockerfile: Dockerfile
    container_name: ms-ruta
    ports:
      - "8086:8086"
    depends_on:
      - eureka
      - mysql

  ms-reserva:
    build:
      context: ./ms-reserva
      dockerfile: Dockerfile
    container_name: ms-reserva
    ports:
      - "8083:8083"
    depends_on:
      - eureka
      - mysql

  ms-pago:
    build:
      context: ./ms-pago
      dockerfile: Dockerfile
    container_name: ms-pago
    ports:
      - "8085:8085"
    depends_on:
      - eureka
      - mysql

volumes:
  mysql_data: