server.port=8086
spring.application.name=ms-ruta

# Conexión a la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bd_ruta?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Crea las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Conexión con Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#configuracion para el gateway
springdoc:
api-docs:
path: /api/rutas/v3/api-docs
