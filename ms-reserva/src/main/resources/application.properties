spring.application.name=ms-reserva

# ==========================================
# CONFIGURACION DEL SERVIDOR Y MICROSERVICIO
# ==========================================
server.port=8083

# ==========================================
# CONFIGURACION DE LA BASE DE DATOS (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/bd_reserva?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ==========================================
# CONFIGURACION DE HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# CONFIGURACION DE EUREKA CLIENT
# ==========================================
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true