spring.application.name=ms-reserva
# ==========================================
# CONFIGURACION DEL SERVIDOR Y MICROSERVICIO
# ==========================================
server.port=8083

# ==========================================
# CONFIGURACION DE LA BASE DE DATOS (MySQL)
# ==========================================
# URL de conexion a tu base de datos en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/bd_reserva?useSSL=false&serverTimezone=UTC

# Credenciales por defecto de XAMPP (root sin contrasena)
spring.datasource.username=root
spring.datasource.password=

# ==========================================
# CONFIGURACION DE HIBERNATE / JPA
# ==========================================
# 'update' crea o actualiza las tablas automaticamente segun tus clases Java
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el codigo SQL que Hibernate ejecuta por detras (muy util para ver que hace)
spring.jpa.show-sql=true

# ==========================================
# CONFIGURACION DE EUREKA CLIENT
# ==========================================
# Indica donde estara escuchando el servidor Eureka (tu directorio telefonico)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true