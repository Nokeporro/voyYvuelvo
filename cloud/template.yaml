AWSTemplateFormatVersion: '2010-09-09'
Description: Voy y Vuelvo EP3 - eventos de reservas, SQS, Lambda y DynamoDB
Parameters:
  ExistingLambdaRoleArn:
    Type: String
    Default: ''
    Description: ARN de rol Lambda existente (opcional; debe tener permisos SQS, DynamoDB y Logs)
  PublisherRoleName:
    Type: String
    Default: ''
    Description: Rol IAM de instancias EC2 (opcional; vacío si ya tiene permisos SQS)
Conditions:
  CreateLambdaRole: !Equals [!Ref ExistingLambdaRoleArn, '']
  AttachPublisherPolicy: !Not [!Equals [!Ref PublisherRoleName, '']]
Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  ReservationQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5
  ConfirmationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
  FunctionLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-confirmar-reserva'
      RetentionInDays: 7
  FunctionRole:
    Condition: CreateLambdaRole
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConsumirReservas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt ReservationQueue.Arn
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ConfirmationTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt FunctionLog.Arn
  PublisherPolicy:
    Condition: AttachPublisherPolicy
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-publicar-reservas'
      Roles: [!Ref PublisherRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt ReservationQueue.Arn
  ReservationFunction:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLog
    Properties:
      FunctionName: !Sub '${AWS::StackName}-confirmar-reserva'
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 30
      MemorySize: 128
      Role: !If [CreateLambdaRole, !GetAtt FunctionRole.Arn, !Ref ExistingLambdaRoleArn]
      Environment:
        Variables:
          TABLE_NAME: !Ref ConfirmationTable
      Code:
        ZipFile: |
          # Se sustituye por serverless/handler.py mediante provision.sh
          def lambda_handler(event, context):
              raise RuntimeError('Debe desplegarse usando scripts/provision.sh')
  QueueTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReservationQueue.Arn
      FunctionName: !Ref ReservationFunction
      BatchSize: 1
      Enabled: true
Outputs:
  QueueUrl:
    Value: !Ref ReservationQueue
  QueueArn:
    Value: !GetAtt ReservationQueue.Arn
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
  TableName:
    Value: !Ref ConfirmationTable
  FunctionName:
    Value: !Ref ReservationFunction
